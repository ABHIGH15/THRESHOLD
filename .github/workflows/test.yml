name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify README and links
        run: python3 scripts/dev/check_readme.py

      - name: Verify citations and symbol references
        run: python3 scripts/dev/check_citations.py

      - name: Verify no unredacted secrets
        run: python3 scripts/dev/check_redaction.py

      - name: Run test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
