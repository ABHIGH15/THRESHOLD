AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Threshold — state-aware triage agent for remote property monitoring.
  Phase 2: skeleton deploy with stub handlers.

Globals:
  Function:
    Timeout: 10
    Runtime: python3.12
    MemorySize: 256
    Environment:
      Variables:
        STATE_TABLE_NAME: !Ref StateTable

Resources:

  # ============================================================
  # DynamoDB — shared persistent state store
  # ============================================================
  # Stores: routine configs, per-device events, correction history,
  # scheduler heartbeats (Phase 2 stub)
  #
  # PK/SK design allows flexible access patterns:
  #   PK=ROUTINE#<name>  SK=CONFIG         → routine configuration
  #   PK=DEVICE#<id>     SK=EVENT#<ts>     → per-device event log
  #   PK=EVENT#<ts>      SK=WEBHOOK_STUB   → Phase 2 stub events
  #   PK=SCHEDULER_HEARTBEAT SK=TICK#<ts>  → Phase 2 heartbeats
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ThresholdState
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ============================================================
  # Lambda — Webhook handler
  # ============================================================
  # Receives Ring webhook events via API Gateway (Function URL in Phase 2).
  # Phase 2: stub that writes raw body to DynamoDB.
  # Phase 3: adds HMAC-SHA256 verification and real payload parsing.
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: threshold-webhook
      Handler: handlers/webhook.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
      Events:
        WebhookApi:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: POST

  # ============================================================
  # Lambda — Scheduler handler
  # ============================================================
  # Triggered by EventBridge Scheduler on a fixed interval.
  # Phase 2: stub that writes a heartbeat to DynamoDB.
  # Phase 4: reads real state, derives routine statuses, runs triage.
  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: threshold-scheduler
      Handler: handlers/scheduler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
      Events:
        ScheduleTick:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Description: "Threshold scheduler tick — absence detection"
            Enabled: true

Outputs:
  WebhookUrl:
    Description: "URL for the webhook endpoint (give this to Ring as the webhook URL)"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook"
  WebhookFunctionArn:
    Description: "Webhook Lambda ARN"
    Value: !GetAtt WebhookFunction.Arn
  SchedulerFunctionArn:
    Description: "Scheduler Lambda ARN"
    Value: !GetAtt SchedulerFunction.Arn
  StateTableName:
    Description: "DynamoDB table name"
    Value: !Ref StateTable
  StateTableArn:
    Description: "DynamoDB table ARN"
    Value: !GetAtt StateTable.Arn
