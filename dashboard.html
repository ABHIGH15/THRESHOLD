<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --th-bg: #1a1714;
      --th-surface: #231f1b;
      --th-card: #2a2520;
      --th-card-hover: #332d27;
      --th-border: #3d3630;
      --th-border-subtle: #2f2924;
      --th-text: #e8e0d8;
      --th-text-secondary: #a89e94;
      --th-text-muted: #7a7068;
      --th-green: #6db88f;
      --th-green-dim: #3a5c48;
      --th-green-glow: rgba(109, 184, 143, 0.12);
      --th-amber: #d4a04a;
      --th-amber-dim: #5c4a28;
      --th-amber-glow: rgba(212, 160, 74, 0.15);
      --th-coral: #d4695a;
      --th-coral-dim: #5c302a;
      --th-coral-glow: rgba(212, 105, 90, 0.18);
      --th-blue: #5a8fd4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--th-bg);
      color: var(--th-text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.015;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .container { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 32px 24px; }

    /* Status pill animations */
    @keyframes gentle-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 20px var(--glow-color, transparent); }
      50% { box-shadow: 0 0 40px var(--glow-color, transparent), 0 0 60px var(--glow-color, transparent); }
    }
    .status-pulse { animation: gentle-pulse 3s ease-in-out infinite; }
    .glow-pulse { animation: glow-pulse 2.5s ease-in-out infinite; }

    /* Routine card states */
    .routine-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .routine-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 14px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .routine-card.missed::before {
      background: radial-gradient(ellipse at center, var(--th-coral-glow) 0%, transparent 70%);
      opacity: 1;
    }
    .routine-card.check-needed::before {
      background: radial-gradient(ellipse at center, var(--th-amber-glow) 0%, transparent 70%);
      opacity: 1;
    }

    /* Dashed border for missed/waiting states */
    .dashed-border {
      border: 2px dashed var(--th-coral);
      background: transparent;
    }
    .watching-border {
      border: 1.5px dashed var(--th-text-muted);
      background: transparent;
    }

    /* Evidence list */
    .evidence-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--th-border-subtle);
    }
    .evidence-item:last-child { border-bottom: none; }

    /* Scene toggle */
    .scene-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--th-border);
      background: var(--th-surface);
      color: var(--th-text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .scene-btn:hover { background: var(--th-card); color: var(--th-text); }
    .scene-btn.active {
      background: var(--th-card-hover);
      color: var(--th-text);
      border-color: var(--th-text-muted);
    }

    /* Investigation card slide-in */
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-in { animation: slide-up 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

    /* Escalation banner */
    @keyframes banner-in {
      from { opacity: 0; transform: translateY(100%); }
      to { opacity: 1; transform: translateY(0); }
    }
    .banner-in { animation: banner-in 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

    /* Correction flash */
    @keyframes correction-flash {
      0% { background: var(--th-green-glow); }
      100% { background: transparent; }
    }
    .correction-flash { animation: correction-flash 1.5s ease-out; }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, var(--th-coral) 0%, var(--th-amber) 100%); display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
        </div>
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px;">Threshold</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12px; color: var(--th-text-muted);" id="clock"></span>
      </div>
    </header>

    <!-- Property + Status -->
    <section style="margin-bottom: 36px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 32px; font-weight: 700; letter-spacing: -0.8px; margin-bottom: 4px;">Dad's House</h1>
          <p style="font-size: 13px; color: var(--th-text-muted);">3 routines configured · Front door cam, Doorbell</p>
        </div>
        <div id="status-pill" style="display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 500;"></div>
      </div>
    </section>

    <!-- Scene Toggle -->
    <section style="margin-bottom: 28px; display: flex; gap: 8px; flex-wrap: wrap;">
      <button class="scene-btn active" onclick="setScene('calm')" id="btn-calm">All On Track</button>
      <button class="scene-btn" onclick="setScene('watching')" id="btn-watching">Watching</button>
      <button class="scene-btn" onclick="setScene('unknown')" id="btn-unknown">Device Offline</button>
      <button class="scene-btn" onclick="setScene('escalation')" id="btn-escalation">Escalation</button>
      <button class="scene-btn" onclick="setScene('correction')" id="btn-correction">Correction</button>
    </section>

    <!-- Daily Timeline -->
    <section style="margin-bottom: 32px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
        <h2 style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--th-text-muted);">Today's Routines</h2>
        <span style="font-size: 12px; color: var(--th-text-muted);" id="date-label"></span>
      </div>
      <div id="timeline" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px;"></div>
    </section>

    <!-- Investigation Panel (hidden by default) -->
    <section id="investigation-panel" style="display: none; margin-bottom: 32px;"></section>

    <!-- Recent Activity -->
    <section style="margin-bottom: 32px;">
      <h2 style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--th-text-muted); margin-bottom: 14px;">Recent Activity</h2>
      <div id="activity-feed" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </section>

    <!-- Escalation Banner (hidden by default) -->
    <div id="escalation-banner" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;"></div>

  </div>

  <script>
    // --- Data ---
    const routines = [
      { name: 'Morning front door', device: 'Front door cam', window: '7:00 – 9:00am', icon: '🚪', delay: '30 min' },
      { name: 'Morning doorbell', device: 'Front doorbell', window: '8:00 – 10:00am', icon: '🔔', delay: '45 min', days: 'Mon, Wed, Fri' },
      { name: 'Evening front door', device: 'Front door cam', window: '5:00 – 7:00pm', icon: '🚪', delay: '60 min', days: 'Weekdays' },
    ];

    const scenes = {
      calm: {
        status: { text: 'All routines on track', color: 'var(--th-green)', bg: 'var(--th-green-glow)', icon: '✓' },
        routineStates: ['observed', 'observed', 'watching'],
        satisfiedTimes: ['7:45am', '8:32am', null],
        activity: [
          { text: 'Motion detected — Front door cam', time: '7:45am', badge: 'Routine', badgeColor: 'var(--th-green)', detail: 'Matched "Morning front door"' },
          { text: 'Button press — Front doorbell', time: '8:32am', badge: 'Routine', badgeColor: 'var(--th-green)', detail: 'Matched "Morning doorbell"' },
          { text: 'Device online — Front door cam', time: '6:12am', badge: null, detail: null },
        ],
        investigation: null,
        escalation: null,
      },
      watching: {
        status: { text: 'Watching — 1 routine pending', color: 'var(--th-amber)', bg: 'var(--th-amber-glow)', icon: '◔' },
        routineStates: ['observed', 'watching', 'future'],
        satisfiedTimes: ['7:45am', null, null],
        activity: [
          { text: 'Motion detected — Front door cam', time: '7:45am', badge: 'Routine', badgeColor: 'var(--th-green)', detail: 'Matched "Morning front door"' },
          { text: 'Device online — Front doorbell', time: '6:30am', badge: null, detail: null },
        ],
        investigation: null,
        escalation: null,
      },
      unknown: {
        status: { text: 'Check Needed — Device data stale', color: 'var(--th-amber)', bg: 'var(--th-amber-glow)', icon: '?' },
        routineStates: ['unknown', 'watching', 'future'],
        satisfiedTimes: [null, null, null],
        activity: [
          { text: 'Device offline — Front door cam', time: '4:18am', badge: null, detail: 'Last event from this device' },
          { text: 'Device online — Front doorbell', time: '6:30am', badge: null, detail: null },
        ],
        investigation: null,
        escalation: null,
      },
      escalation: {
        status: { text: 'Escalation — Morning routine missed', color: 'var(--th-coral)', bg: 'var(--th-coral-glow)', icon: '⚠' },
        routineStates: ['missed', 'observed', 'future'],
        satisfiedTimes: [null, '8:32am', null],
        activity: [
          { text: 'Button press — Front doorbell', time: '8:32am', badge: 'Routine', badgeColor: 'var(--th-green)', detail: 'Matched "Morning doorbell"' },
          { text: 'Motion detected — Front door cam', time: 'Yesterday 6:12pm', badge: null, detail: 'Last activity at front door' },
        ],
        investigation: {
          title: 'Agent Investigation',
          subtitle: 'Morning front door — Expected 7:00–9:00am',
          evidence: [
            { found: true,  text: 'Doorbell activity at 8:32am (nurse visit confirmed)' },
            { found: false, text: 'No front door motion since yesterday 6:12pm' },
            { found: true,  text: 'Front door cam online and reporting' },
            { found: 'mixed', text: 'Household memory: similar pattern flagged as false alarm 2 times before — but both prior instances showed kitchen sensor activity within the window; none detected today' },
            { found: false, text: 'No activity from any sensor since doorbell at 8:32am' },
          ],
          recommendation: 'Escalation',
          gate: 'Deterministic gate cleared: routine unsatisfied + device healthy + agent recommends escalation',
        },
        escalation: {
          line1: 'SMS sent to Sarah at 9:32am',
          line2: 'Voice call queued — will trigger in 10 minutes if no response',
        },
      },
      correction: {
        status: { text: 'Correction logged — routine updated', color: 'var(--th-green)', bg: 'var(--th-green-glow)', icon: '↩' },
        routineStates: ['observed-late', 'observed', 'future'],
        satisfiedTimes: ['9:45am ↩', '8:32am', null],
        activity: [
          { text: 'FALSE ALARM received from Sarah', time: '9:38am', badge: 'Correction', badgeColor: 'var(--th-blue)', detail: 'Dad was in the backyard — entered through back door' },
          { text: 'Escalation recalled', time: '9:38am', badge: null, detail: 'Voice call cancelled' },
          { text: 'Button press — Front doorbell', time: '8:32am', badge: 'Routine', badgeColor: 'var(--th-green)', detail: 'Matched "Morning doorbell"' },
        ],
        investigation: {
          title: 'Correction Recorded',
          subtitle: 'This pattern will be remembered for future events',
          evidence: [
            { found: true, text: 'Caretaker response: "Dad was in the backyard"' },
            { found: true, text: 'Pattern logged: front door may be skipped on garden mornings' },
            { found: true, text: 'Agent will check this correction on future morning-door misses' },
          ],
          recommendation: null,
          gate: 'Stored in household memory → check_household_memory will surface this on similar future events',
        },
        escalation: null,
      },
    };

    // --- Rendering ---
    function renderStatusPill(status) {
      const pill = document.getElementById('status-pill');
      const isPulse = status.icon === '⚠';
      pill.style.background = status.bg;
      pill.style.border = `1px solid ${status.color}40`;
      pill.style.color = status.color;
      pill.className = isPulse ? 'glow-pulse' : '';
      pill.style.setProperty('--glow-color', isPulse ? status.bg : 'transparent');
      pill.innerHTML = `
        <span style="font-size: 16px;" class="${isPulse ? 'status-pulse' : ''}">${status.icon}</span>
        <span>${status.text}</span>
      `;
    }

    function renderTimeline(states, times) {
      const container = document.getElementById('timeline');
      container.innerHTML = '';
      routines.forEach((r, i) => {
        const state = states[i];
        const time = times[i];
        const card = document.createElement('div');
        card.className = 'routine-card';

        let stateClass = '';
        let borderStyle = `border: 1px solid var(--th-border);`;
        let statusLine = '';
        let statusColor = 'var(--th-text-muted)';
        let bgColor = 'var(--th-card)';
        let iconOpacity = '0.5';

        if (state === 'observed' || state === 'observed-late') {
          statusLine = `<span style="color: var(--th-green);">✓ ${time}</span>`;
          statusColor = 'var(--th-green)';
          borderStyle = `border: 1px solid var(--th-green-dim);`;
          bgColor = 'var(--th-card)';
          iconOpacity = '0.8';
        } else if (state === 'watching') {
          statusLine = `<span style="color: var(--th-text-muted);">Waiting…</span>`;
          borderStyle = `border: 1.5px dashed var(--th-text-muted);`;
          bgColor = 'transparent';
        } else if (state === 'missed') {
          stateClass = 'missed';
          statusLine = `<span style="color: var(--th-coral); font-weight: 600;">No activity detected</span>`;
          statusColor = 'var(--th-coral)';
          borderStyle = `border: 2px dashed var(--th-coral);`;
          bgColor = 'transparent';
          iconOpacity = '1';
        } else if (state === 'unknown') {
          stateClass = 'check-needed';
          statusLine = `<span style="color: var(--th-amber); font-weight: 500;">Device data stale — cannot confirm</span>`;
          statusColor = 'var(--th-amber)';
          borderStyle = `border: 2px dashed var(--th-amber);`;
          bgColor = 'transparent';
          iconOpacity = '0.7';
        } else if (state === 'future') {
          statusLine = `<span style="color: var(--th-text-muted);">Later today</span>`;
          bgColor = 'var(--th-surface)';
          iconOpacity = '0.3';
        }

        card.classList.add(stateClass);
        card.style.cssText = `${borderStyle} border-radius: 14px; padding: 18px; background: ${bgColor}; min-height: 130px; display: flex; flex-direction: column; justify-content: space-between;`;
        card.innerHTML = `
          <div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
              <span style="font-size: 22px; opacity: ${iconOpacity};">${r.icon}</span>
              ${state === 'missed' ? '<span style="font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--th-coral-dim); color: var(--th-coral); font-weight: 600;">ESCALATION</span>' : ''}
              ${state === 'observed' || state === 'observed-late' ? '<span style="font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--th-green-dim); color: var(--th-green); font-weight: 500;">ROUTINE</span>' : ''}
              ${state === 'unknown' ? '<span style="font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--th-amber-dim); color: var(--th-amber); font-weight: 600;">CHECK NEEDED</span>' : ''}
            </div>
            <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 3px;">${r.name}</h3>
            <p style="font-size: 12px; color: var(--th-text-muted); margin-bottom: 2px;">${r.window}${r.days ? ' · ' + r.days : ''}</p>
          </div>
          <div style="margin-top: 10px; font-size: 13px;">
            ${statusLine}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderActivity(items) {
      const feed = document.getElementById('activity-feed');
      feed.innerHTML = '';
      items.forEach(item => {
        const el = document.createElement('div');
        el.style.cssText = `display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 16px; background: var(--th-card); border: 1px solid var(--th-border-subtle); border-radius: 10px; gap: 12px;`;
        el.innerHTML = `
          <div style="flex: 1; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
              <span style="font-size: 13px; font-weight: 500;">${item.text}</span>
              ${item.badge ? `<span style="font-size: 11px; padding: 2px 8px; border-radius: 6px; background: ${item.badgeColor}20; color: ${item.badgeColor}; font-weight: 600;">${item.badge}</span>` : ''}
            </div>
            ${item.detail ? `<p style="font-size: 12px; color: var(--th-text-muted); margin-top: 4px;">${item.detail}</p>` : ''}
          </div>
          <span style="font-size: 12px; color: var(--th-text-muted); white-space: nowrap;">${item.time}</span>
        `;
        feed.appendChild(el);
      });
    }

    function renderInvestigation(inv) {
      const panel = document.getElementById('investigation-panel');
      if (!inv) { panel.style.display = 'none'; return; }
      panel.style.display = 'block';
      const isCorrection = inv.title === 'Correction Recorded';
      const accentColor = isCorrection ? 'var(--th-green)' : 'var(--th-coral)';
      const accentDim = isCorrection ? 'var(--th-green-dim)' : 'var(--th-coral-dim)';

      panel.innerHTML = `
        <div class="slide-in" style="background: var(--th-card); border: 1px solid ${accentDim}; border-radius: 14px; padding: 22px; position: relative; overflow: hidden;">
          <div style="position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, ${accentColor}, transparent);"></div>
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
            <span style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: ${accentColor};">${inv.title}</span>
          </div>
          <p style="font-size: 13px; color: var(--th-text-secondary); margin-bottom: 18px;">${inv.subtitle}</p>
          <div style="margin-bottom: 18px;">
            ${inv.evidence.map(e => {
              const icon = e.found === 'mixed' ? '◬' : (e.found ? '✓' : '✗');
              const color = e.found === 'mixed' ? 'var(--th-amber)' : (e.found ? 'var(--th-green)' : 'var(--th-coral)');
              return `
              <div class="evidence-item">
                <span style="color: ${color}; font-size: 14px; flex-shrink: 0; margin-top: 1px;">${icon}</span>
                <span style="font-size: 13px; color: var(--th-text-secondary);">${e.text}</span>
              </div>`;
            }).join('')}
          </div>
          ${inv.recommendation ? `
            <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: ${accentDim}; border-radius: 8px; margin-bottom: 10px;">
              <span style="color: ${accentColor}; font-size: 14px;">→</span>
              <span style="font-size: 13px; font-weight: 600; color: ${accentColor};">Recommendation: ${inv.recommendation}</span>
            </div>
          ` : ''}
          <p style="font-size: 11px; color: var(--th-text-muted); font-style: italic;">${inv.gate}</p>
        </div>
      `;
    }

    function renderEscalation(esc) {
      const banner = document.getElementById('escalation-banner');
      if (!esc) { banner.style.display = 'none'; return; }
      banner.style.display = 'block';
      banner.innerHTML = `
        <div class="banner-in" style="background: linear-gradient(180deg, var(--th-coral-dim) 0%, #2a1210 100%); border-top: 1px solid var(--th-coral); padding: 18px 24px; display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--th-coral); animation: gentle-pulse 1.5s infinite;"></div>
            <span style="font-size: 14px; font-weight: 600; color: var(--th-coral);">Escalation Active</span>
          </div>
          <span style="font-size: 13px; color: var(--th-text-secondary);">${esc.line1}</span>
          <span style="font-size: 12px; color: var(--th-text-muted);">·</span>
          <span style="font-size: 13px; color: var(--th-text-secondary);">${esc.line2}</span>
        </div>
      `;
    }

    // --- Scene Management ---
    function setScene(name) {
      document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${name}`).classList.add('active');

      const scene = scenes[name];
      renderStatusPill(scene.status);
      renderTimeline(scene.routineStates, scene.satisfiedTimes);
      renderActivity(scene.activity);
      renderInvestigation(scene.investigation);
      renderEscalation(scene.escalation);
    }

    // --- Clock ---
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date-label').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }

    // --- Init ---
    updateClock();
    setInterval(updateClock, 30000);
    setScene('calm');
  </script>
</body>
</html>
